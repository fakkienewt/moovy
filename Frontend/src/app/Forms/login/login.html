<div class="auth-page">
    <div class="auth-card">
        <button class="auth-close" (click)="onClose()" type="button">✕</button>
        <h1 class="auth-title">Вход</h1>
        <form class="auth-form" (ngSubmit)="onSubmit()">
            <div class="auth-field">
                <label class="auth-label">EMAIL</label>
                <input type="email" class="auth-input" placeholder="example@mail.com" [(ngModel)]="email" name="email">
            </div>
            <div class="auth-field">
                <label class="auth-label">ПАРОЛЬ</label>
                <input type="password" class="auth-input" placeholder="Введите пароль" [(ngModel)]="password"
                    name="password">
            </div>
            @if (error) { <div class="auth-error">{{ error }}</div> }
            <button type="submit" class="auth-btn" [disabled]="loading">
                {{ loading ? 'Вход...' : 'Войти' }}
            </button>
        </form>
        <div class="auth-footer">
            Нет аккаунта?
            <a routerLink="/auth" class="auth-link">Зарегистрироваться</a>
        </div>
    </div>
</div>
