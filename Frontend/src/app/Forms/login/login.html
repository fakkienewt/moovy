<div class="auth-page">
    <div class="auth-card">
        <button class="auth-close" (click)="onClose()" type="button">✕</button>
        <h1 class="auth-title">Вход</h1>
        <form class="auth-form">
            <div class="auth-field">
                <label class="auth-label">Email</label>
                <input type="email" class="auth-input" placeholder="example@mail.com">
            </div>
            <div class="auth-field">
                <label class="auth-label">Пароль</label>
                <input type="password" class="auth-input" placeholder="Введите пароль">
            </div>
            <button type="submit" class="auth-btn">Войти</button>
        </form>
        <div class="auth-footer">
            Нет аккаунта?
            <a routerLink="/auth" class="auth-link">Зарегистрироваться</a>
        </div>
    </div>
</div>
