<header class="basic-header">
    <div class="basic-header-container">
        <div class="basic-header-section-logo">
            <div class="basic-header-logo" (click)="onLogoClick()">Moovy</div>
        </div>

        <div class="basic-header-section-search">
            <div class="basic-header-section-search-input">
                <input class="basic-header-input-search" type="text" placeholder="Найти фильм, сериал">
                <button class="basic-header-button-search">
                    <img src="/SVG/basic-header-button-svg-1.svg">
                </button>
            </div>
        </div>

        <div class="basic-header-section-profile">
            <button>
                <img src="/SVG/basic-header-button-svg-2.svg">
            </button>
        </div>
    </div>
</header>
