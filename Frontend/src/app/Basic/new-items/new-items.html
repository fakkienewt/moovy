<div class="page-wrap">
    <div class="basic-new">
        <div class="basic-new-logo">НОВИНКИ</div>
        <div class="basic-new-container">
            <div class="basic-new-container-arrows left" [class.disabled]="current_index === 0" (click)="OnPrev()">
                <img src="/SVG/basic-new-button-svg-1.svg">
            </div>
            <div class="basic-new-section">
                <div class="basic-new-loading">
                    @if (is_loading || has_error) {
                    @for (item of [1,2,3,4]; track item) {
                    <div class="basic-new-section-movie-poster empty">
                        <div class="basic-new-poster">
                            <div class="empty-poster"></div>
                        </div>
                        <div class="movie-info">
                            <div class="empty-year"></div>
                        </div>
                    </div>
                    }
                    } @else {
                    @for (movie of (is_mobile ? new_items_2026 : visible_movies); track movie.id) {
                    <div class="basic-new-section-movie-poster" (click)="OnSelectMovie(movie)">
                        <div class="basic-new-poster">
                            <img [src]="movie.poster" [alt]="movie.name">
                        </div>
                        <div class="movie-info">
                            <div class="movie-year">{{ movie.year }}</div>
                        </div>
                    </div>
                    }
                    }
                </div>
            </div>
            <div class="basic-new-container-arrows right"
                [class.disabled]="current_index + items_per_page >= new_items_2026.length" (click)="OnNext()">
                <img src="/SVG/basic-new-button-svg-2.svg">
            </div>
        </div>
    </div>
</div>
